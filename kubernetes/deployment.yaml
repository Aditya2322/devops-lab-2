apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab2
  template:
    metadata:
      labels:
        app: devops-lab2
    spec:
      containers:
        - name: devops-lab-2
          image: Aditya2322/devops-lab-2:v2
          ports:
            - containerPort: 5000
